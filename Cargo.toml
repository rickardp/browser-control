[package]
name = "browser-control"
version = "0.3.5"
edition = "2021"
rust-version = "1.80"
description = "CLI that manages browsers and exposes them over CDP/BiDi for agent-driven development. Includes an optional MCP server."
license = "MIT"
repository = "https://github.com/rickardp/browser-control"
readme = "README.md"
keywords = ["browser", "cdp", "bidi", "mcp", "automation"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "browser-control"
path = "src/main.rs"

[lib]
name = "browser_control"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "io-std", "fs", "process", "net", "sync", "time", "signal"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
directories = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
fs2 = "0.4"
sysinfo = "0.32"
which = "6"
url = "2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
futures-util = "0.3"
toml = "0.8"
regex = "1"
capnp = "0.20"
capnp-rpc = "0.20"
capnp-futures = "0.20"
async-trait = "0.1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation"] }

[build-dependencies]
capnpc = "0.20"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
mockito = "1"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[workspace]
members = ["xtask"]
